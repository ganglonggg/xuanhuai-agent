<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>宣怀 Agent</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside class="sidebar"><div class="traffic-space"></div><div class="brand"><img src="xuanhuai-original.png" alt="宣怀学院"><span>个人 <small>AGENT</small></span></div><button id="newChat" class="new-chat"><span>＋</span> 新对话 <kbd>⌘N</kbd></button><div class="list-label">最近对话</div><div id="conversations" class="conversations"></div><div class="side-footer"><button id="settingsButton"><span>⚙</span> 设置与连接</button><div class="local-label"><i></i> 会话保存在这台 Mac</div></div></aside><main><header class="titlebar"><div id="chatTitle">新的对话</div><div class="toolbar"><button id="cooperationButton">项目与合作 <b id="cooperationUnread"></b></button><button id="weeklyButton">每周推荐</button><button id="memoryButton">我的记忆</button><button id="followingButton" title="关注的事">关注的事 <b id="unread"></b></button><button id="exportButton" title="导出对话">导出</button></div></header><section id="conversation" class="conversation" aria-live="polite"></section><footer class="composer-zone"><div class="composer"><div class="home-greeting"><span>✳</span> 我在这里，帮你把散落的可能整理好。<i>● 在这里</i></div><div id="modeBanner" class="mode-banner hidden"></div><form id="sendForm"><label class="sr-only" for="prompt">向宣怀 agent 交代任务</label><textarea id="prompt" rows="2" maxlength="2000" placeholder="问我一个问题，或交给我一件事…"></textarea><div class="composer-tools"><button id="modeButton" type="button" class="mode-button">对话⌄</button><span id="modelStatus" class="model-status"></span><button id="stopButton" type="button" class="stop hidden">停止任务</button><button id="sendButton" class="send" title="发送任务"><span class="send-label">开始聊聊</span> ↑</button></div></form></div><div class="home-actions"><button data-action="interview"><span>01</span>先认识我 <b>↗</b></button><button data-scroll="home-discover"><span>02</span>今日整理 <b>↗</b></button><button data-scroll="home-week"><span>03</span>本周课程 <b>↗</b></button></div><div class="home-scroll-cue" data-scroll="home-discover" role="button" tabindex="0">向下，发现与你有关的可能 ↓</div><div class="home-chapters"><section id="home-discover" class="home-chapter"><p class="chapter-kicker">01 / YOUR DAILY EDIT</p><h2>值得留意的，<em>刚好与你有关。</em></h2><p>从宣怀资料与公开课程中，找到你感兴趣的方向。</p><div class="home-card-grid"><button data-question="请推荐宣怀学院值得了解的创业案例，并附上资料出处。"><small>创业案例</small><strong>看看真实的创业故事</strong><span>探索案例与经验 ↗</span></button><button data-question="宣怀学院有哪些值得关注的课程和活动？请说明信息时间和来源。"><small>课程与活动</small><strong>寻找最近的学习机会</strong><span>向 Agent 提问 ↗</span></button><button data-action="ventureMode"><small>行动计划</small><strong>让想法迈出下一步</strong><span>开始规划 ↗</span></button></div></section><section id="home-week" class="home-chapter"><p class="chapter-kicker">02 / A WEEK OF POSSIBILITIES</p><h2>给好奇心，<em>留一点时间。</em></h2><p>查看你的一周推荐和公开课程安排。</p><div id="home-week-content" class="home-data">正在整理课程…</div><button class="home-link" data-action="weekly">查看每周推荐 →</button></section><section id="home-connect" class="home-chapter"><p class="chapter-kicker">03 / BETTER, TOGETHER</p><h2>有些下一步，<em>可以一起走。</em></h2><p>先看看合作的可能，再决定是否进一步了解。</p><div id="home-connect-content" class="home-data">正在查看合作机会…</div><button class="home-link" data-action="homeCooperation">查看项目与合作 →</button></section></div></footer></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden" role="status"></div><script src="renderer.js"></script><script src="cooperation.js"></script><script src="accounts.js"></script></body></html>
